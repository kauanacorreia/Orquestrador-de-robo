<div class="dashboard-home">
  <header class="dashboard-home__header">
    <h1>Dashboard do Orquestrador</h1>
  </header>

  <app-dashboard-filters
    class="dashboard-home__filters"
    [filters]="filters()"
    [filterOptions]="filterOptions()"
    (filtersChange)="onFiltersChange($event)"
  ></app-dashboard-filters>

  @if (summary(); as summary) {
    <app-dashboard-kpis [summary]="summary"></app-dashboard-kpis>
  } @else if (loading()) {
    <p class="dashboard-home__loading">Carregando dashboard...</p>
  } @else if (error(); as error) {
    <p class="dashboard-home__error">{{ error }}</p>
  }

  <section class="dashboard-home__charts">
    <div class="dashboard-home__chart dashboard-home__chart--full">
      <h2>Volumetria por dia</h2>
      <app-volumetria-chart [data]="volumetria()"></app-volumetria-chart>
    </div>
  </section>

  <section class="dashboard-home__activity">
    <div class="dashboard-home__activity-header">
      <h2>Atividades em tempo real</h2>

      <mat-form-field appearance="outline" class="dashboard-home__activity-limit">
        <mat-label>Exibir</mat-label>
        <mat-select [ngModel]="activityLimit()" (ngModelChange)="setActivityLimit($event)">
          @for (option of activityLimitOptions; track option) {
            <mat-option [value]="option">{{ option }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <app-activity-table [logs]="visibleLogs()"></app-activity-table>
  </section>
</div>
