<div class="dashboard-filters">
  <mat-form-field appearance="outline" class="dashboard-filters__field dashboard-filters__field--date-range">
    <mat-label>Período</mat-label>

    <mat-date-range-input [rangePicker]="picker" [formGroup]="rangeForm">
      <input matStartDate formControlName="start" placeholder="Início" (dateChange)="onRangeChange()" />
      <input matEndDate formControlName="end" placeholder="Fim" (dateChange)="onRangeChange()" />
    </mat-date-range-input>

    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>

    <mat-date-range-picker #picker>
      <mat-datepicker-actions>
        <div class="dashboard-filters__quick-presets">
          @for (preset of quickPresets; track preset.value) {
            <button
              mat-stroked-button
              type="button"
              class="dashboard-filters__quick-preset"
              (click)="onPeriodPresetChange(preset.value, picker)"
            >
              {{ preset.label }}
            </button>
          }
        </div>

        <span class="dashboard-filters__spacer"></span>

        <div class="dashboard-filters__action-buttons">
          <button mat-button matDatepickerCancel type="button">Cancelar</button>
          <button mat-flat-button color="primary" matDatepickerApply type="button">Aplicar</button>
        </div>
      </mat-datepicker-actions>
    </mat-date-range-picker>
  </mat-form-field>

  <app-multi-autocomplete-field
    class="dashboard-filters__field"
    label="Robô"
    [options]="robotOptions()"
    [selectedIds]="filters.robotIds"
    (selectedIdsChange)="onRobotsChange($event)"
  ></app-multi-autocomplete-field>

  <app-multi-autocomplete-field
    class="dashboard-filters__field"
    label="Cliente"
    [options]="clientOptions()"
    [selectedIds]="filters.clientIds"
    (selectedIdsChange)="onClientsChange($event)"
  ></app-multi-autocomplete-field>

  <app-multi-autocomplete-field
    class="dashboard-filters__field"
    label="Usuário"
    [options]="userOptions()"
    [selectedIds]="filters.userIds"
    (selectedIdsChange)="onUsersChange($event)"
  ></app-multi-autocomplete-field>

  <mat-form-field appearance="outline" class="dashboard-filters__field">
    <mat-label>Status</mat-label>
    <mat-select
      multiple
      [ngModel]="filters.statuses"
      (ngModelChange)="onStatusesChange($event)"
    >
      @for (status of statusOptions; track status.value) {
        <mat-option [value]="status.value">{{ status.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button type="button" class="dashboard-filters__clear" (click)="clearFilters()">
    Limpar filtros
  </button>
</div>
