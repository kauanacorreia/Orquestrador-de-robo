<div class="activity-table">
  <table mat-table [dataSource]="rows()" class="activity-table__table">
    <ng-container matColumnDef="timestamp">
      <th mat-header-cell *matHeaderCellDef>Hora</th>
      <td mat-cell *matCellDef="let log">{{ log.timestamp | date: 'HH:mm' }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let log">
        <span class="activity-table__status" [class]="'activity-table__status--' + log.status">
          <span class="activity-table__status-dot"></span>
          {{ statusLabel(log.status) }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="robotName">
      <th mat-header-cell *matHeaderCellDef>Nome do robô</th>
      <td mat-cell *matCellDef="let log">{{ log.robotName }}</td>
    </ng-container>

    <ng-container matColumnDef="step">
      <th mat-header-cell *matHeaderCellDef>Etapa</th>
      <td mat-cell *matCellDef="let log">{{ log.step }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (rows().length === 0) {
    <p class="activity-table__empty">Nenhuma atividade encontrada para os filtros selecionados.</p>
  }
</div>
